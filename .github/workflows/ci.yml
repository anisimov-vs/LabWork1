name: CI

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'

jobs:
  build-and-bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          pip install matplotlib

      - name: Build
        run: |
          make -j$(nproc)

      - name: Run benchmarks
        run: |
          bash bench.sh

      - name: Generate plot
        run: |
          python3 plot_results.py

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench_results
          path: bench_results 